version: 2
updates:
  - package-ecosystem: docker
    directory: /wasm
    schedule:
      interval: monthly
    commit-message:
      prefix: "bumped"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "bumped"

  # pnpm, and the tests/e2e workspace with it. Security fixes come as one pull
  # request, since every one of them edits pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "bumped"

  - package-ecosystem: gomod
    directory: /wasm
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # A replace in go.mod points this at OpenTofu's fork, at the commit
    # OpenTofu pins, so a bump of the require line changes nothing that is
    # built. wasm/README.md says how to move the fork.
    ignore:
      - dependency-name: "github.com/hashicorp/hcl/v2"
    commit-message:
      prefix: "bumped"
