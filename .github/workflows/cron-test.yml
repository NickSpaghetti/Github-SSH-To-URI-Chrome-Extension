name: Continuous Integration Chron

on:
  workflow_dispatch:
  schedule:
    - cron: "00 12 * * *"

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Enable corepack
        run: corepack enable

      - name: Run install
        run: yarn install

      - name: Run lint
        run: yarn lint

      - name: Run format check
        run: yarn format:check

      - name: Audit production dependencies
        run: yarn audit:prod

      - name: Audit dev dependencies
        run: yarn audit:dev
        continue-on-error: true

      # The wasm build runs in a container, so Go's caches are bind mounted out
      # of it. Without this every run re-downloads the module graph.
      - name: Cache the Go module and build cache
        uses: actions/cache@v6
        with:
          path: .gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('wasm/go.sum', 'Makefile') }}
          restore-keys: gocache-${{ runner.os }}-

      # `make build` builds the wasm parser first: it is generated from wasm/
      # and not committed, so a fresh checkout has to produce it. Needs Docker,
      # which the runner provides.
      - name: Run build
        run: make build

      # The build type checks the .ts files but not the .svelte components.
      - name: Typecheck
        run: make typecheck

      - name: Test the app
        run: make test

      - name: Check the corpus still matches the fixture repository
        run: make check-corpus-sync

      - name: Install end to end dependencies
        working-directory: tests/e2e
        run: yarn install

      - name: Install Chromium for Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        working-directory: tests/e2e
        # Extensions need a full browser, so the run is headed under a
        # virtual display rather than headless.
        run: xvfb-run -a yarn e2e
