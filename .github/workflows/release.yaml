name: Publish To Chrome Store

on:
  release:
    types: [published]
    tags:
      - v.*.*.*
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Publish without running end to end tests"
        type: boolean
        default: false

jobs:
  build:
    name: Build and Release to Chrome Extension Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Enable corepack
        run: corepack enable

      - name: Run install
        run: yarn install

      - name: Run build
        run: yarn build

      - name: Test the app
        run: yarn test

      - name: Install end to end dependencies
        if: ${{ inputs.skip_e2e != true }}
        working-directory: tests/e2e
        run: yarn install

      - name: Install Chromium for Playwright
        if: ${{ inputs.skip_e2e != true }}
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        if: ${{ inputs.skip_e2e != true }}
        working-directory: tests/e2e
        # Extensions need a full browser, so the run is headed under a
        # virtual display rather than headless.
        run: xvfb-run -a yarn e2e

      - name: add chrome-webstore-cli
        working-directory: src/
        run: yarn add chrome-webstore-upload-cli@3

      - name: Submit to Chrome Extension Store
        working-directory: dist
        run: npx chrome-webstore-upload-cli@3 upload --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
