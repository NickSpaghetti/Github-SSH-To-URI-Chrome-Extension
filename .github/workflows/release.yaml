name: Publish To Chrome Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Publish without running end to end tests"
        type: boolean
        default: false

jobs:
  build:
    name: Build and Release to Chrome Extension Store
    # The release event takes no tag filter, so the tag is checked here.
    # Prereleases stay off the store, because the upload auto-publishes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      # Reads the version from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      # One install covers the root and the tests/e2e workspace.
      - name: Run install
        run: pnpm install --frozen-lockfile

      # The wasm build runs in a container, so Go's caches are bind mounted out
      # of it. Without this every run re-downloads the module graph.
      - name: Cache the Go module and build cache
        uses: actions/cache@v6
        with:
          path: .gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('wasm/go.sum', 'Makefile') }}
          restore-keys: gocache-${{ runner.os }}-

      # `make build` builds the wasm parser first: it is generated from wasm/
      # and not committed, so a fresh checkout has to produce it. Needs Docker,
      # which the runner provides.
      - name: Run build
        run: make build

      - name: Test the app
        run: make test

      - name: Install Chromium for Playwright
        if: ${{ inputs.skip_e2e != true }}
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end to end tests
        if: ${{ inputs.skip_e2e != true }}
        working-directory: tests/e2e
        # Extensions need a full browser, so the run is headed under a
        # virtual display rather than headless.
        run: xvfb-run -a pnpm e2e

      - name: Submit to Chrome Extension Store
        working-directory: dist
        run: pnpm dlx chrome-webstore-upload-cli@3 upload --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
