name: Continuous Integration
concurrency:
  group: production

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Run install
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run format check
        run: pnpm format:check

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Audit dev dependencies
        run: pnpm audit:dev

      # The wasm build runs in a container, so Go's caches are bind mounted out
      # of it. Without this every run re-downloads the module graph.
      - name: Cache the Go module and build cache
        uses: actions/cache@v6
        with:
          path: .gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('wasm/go.sum', 'Makefile') }}
          restore-keys: gocache-${{ runner.os }}-

      - name: Run build
        run: make build

      - name: Check the third-party notices match what ships
        run: make check-third-party-notices

      - name: Typecheck
        run: make typecheck

      - name: Test the app
        run: make test
