<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bigelow+Rules&family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            /* Chrome caps a popup at 800px. Sizing to content lets the table
               set the width, and the name column's ellipsis is what stops it
               from ever scrolling sideways. */
            body {
                margin: 0;
                width: max-content;
                max-width: 800px;
            }
        </style>
    </head>
    <body>
        <div id="sources-popup"></div>
    </body>
    <script src="index.js"></script>
</html>
